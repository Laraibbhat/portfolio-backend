spring.application.name=portfolio-backend
server.port=8080

# MySQL Database Configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_app
#spring.datasource.username=root
#spring.datasource.password=root
spring.datasource.url=jdbc:mysql://mysql-20010a39-lmushtaq10-6f27.e.aivencloud.com:24270/portfolio_app
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.portfolio.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:portfolio-avatars}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.presigned-url-expiration=300
aws.s3.max-file-size=5242880