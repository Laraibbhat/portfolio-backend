spring.application.name=portfolio-backend
server.port=8080

# MySQL Database Configuration
# The URL parameters are driven by environment variables so you can toggle SSL and
# public-key retrieval behavior per environment (Render vs local).
# DB_USE_SSL default=false for Render internal connections; set to true if TLS is required.
# DB_REQUIRE_SSL default=false; DB_ALLOW_PUBLIC_KEY_RETRIEVAL default=true to avoid RSA issues when needed.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio_app}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.portfolio.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:portfolio-avatars}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.presigned-url-expiration=300
aws.s3.max-file-size=5242880